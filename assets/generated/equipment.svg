<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Mangrok kitchen instrument room</title><desc id="desc">Original Mangrok culinary illustration</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8f4"/><stop offset="0.48" stop-color="#f7eaf1"/><stop offset="1" stop-color="#e7e9f8"/></linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#f5e9e4"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf0f2"/><stop offset="0.45" stop-color="#8e969d"/><stop offset="0.65" stop-color="#f6f7f7"/><stop offset="1" stop-color="#59626a"/></linearGradient>
  <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd0a8"/><stop offset="0.5" stop-color="#c6754a"/><stop offset="1" stop-color="#7b3e2b"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a4c89d"/><stop offset="1" stop-color="#3e7058"/></linearGradient>
  <linearGradient id="tomato" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb194"/><stop offset="1" stop-color="#c95355"/></linearGradient>
  <linearGradient id="sauce" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#efa77c"/><stop offset="1" stop-color="#8f3541"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#553445" flood-opacity=".17"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="4" result="noise"/><feColorMatrix in="noise" type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .05"/></feComponentTransfer></filter>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="#8b647c" opacity=".12"/></pattern>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#dots)"/>

<ellipse cx="1280" cy="140" rx="280" ry="150" fill="#d8deee" opacity=".8" filter="url(#soft)"/><ellipse cx="310" cy="850" rx="320" ry="170" fill="#f3cbd7" opacity=".52" filter="url(#soft)"/>
<g filter="url(#shadow)"><rect x="92" y="80" width="1416" height="840" rx="58" fill="#fffaf7" stroke="#fff" stroke-width="5"/></g>
<text x="150" y="160" font-family="Georgia,serif" font-size="44" fill="#5e4254">The kitchen instrument room</text><text x="152" y="202" font-family="Arial,sans-serif" font-size="18" fill="#927488" letter-spacing="2">COOKWARE · UTENSILS · PREPARATION · CONTROL</text>
<g transform="translate(150 285)"><ellipse cx="315" cy="430" rx="302" ry="60" fill="#604757" opacity=".14"/><path d="M135 78h352l-36 300c-7 59-52 102-108 102H279c-56 0-101-43-108-102Z" fill="url(#metal)" stroke="#555b61" stroke-width="8"/><ellipse cx="311" cy="77" rx="176" ry="45" fill="#30383d"/><ellipse cx="311" cy="69" rx="144" ry="30" fill="#b8c0c5"/><path d="M116 134H28c-49 0-49 86 0 86h98M506 134h88c49 0 49 86 0 86h-98" fill="none" stroke="#697279" stroke-width="32" stroke-linecap="round"/><path d="M220 22c25-58 154-58 180 0" fill="none" stroke="#6f777d" stroke-width="22" stroke-linecap="round"/></g>
<g transform="translate(720 280)" filter="url(#shadow)"><rect width="650" height="470" rx="48" fill="#f5e8ed" stroke="#ead2dd" stroke-width="3"/><g transform="translate(45 54)"><path d="M10 332L175 45" stroke="#825d48" stroke-width="22" stroke-linecap="round"/><ellipse cx="190" cy="36" rx="55" ry="34" fill="#bf8c64" transform="rotate(-29 190 36)"/><path d="M172 315L324 25" stroke="#899296" stroke-width="18" stroke-linecap="round"/><path d="M332 5c42 20 63 62 52 104-49 14-92-10-105-48Z" fill="url(#metal)"/><path d="M365 337L455 25" stroke="#6d4d45" stroke-width="20" stroke-linecap="round"/><path d="M436 31c12-35 57-37 75-8l-27 87-74-23Z" fill="url(#copper)"/><path d="M492 334L547 55" stroke="#6a6f73" stroke-width="17" stroke-linecap="round"/><path d="M508 49c37-35 78-18 91 17l-12 82-96-16Z" fill="url(#metal)"/></g><text x="50" y="427" font-family="Georgia,serif" font-size="27" fill="#5d4054">Every tool changes the recipe’s physics.</text></g>
<g transform="translate(150 790)"><rect width="1220" height="82" rx="28" fill="#e9edf5"/><text x="34" y="35" font-family="Arial,sans-serif" font-size="14" fill="#6a7287">SIMULATION INPUT</text><text x="34" y="62" font-family="Georgia,serif" font-size="24" fill="#535c73">Pan material, vessel depth, heat source, stirring tool and cooking method.</text></g>

<rect width="1600" height="1000" filter="url(#grain)" opacity=".7"/>
</svg>