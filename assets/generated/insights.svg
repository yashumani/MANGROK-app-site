<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Mangrok live AI cooking insights</title><desc id="desc">Original Mangrok culinary illustration</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8f4"/><stop offset="0.48" stop-color="#f7eaf1"/><stop offset="1" stop-color="#e7e9f8"/></linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#f5e9e4"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf0f2"/><stop offset="0.45" stop-color="#8e969d"/><stop offset="0.65" stop-color="#f6f7f7"/><stop offset="1" stop-color="#59626a"/></linearGradient>
  <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd0a8"/><stop offset="0.5" stop-color="#c6754a"/><stop offset="1" stop-color="#7b3e2b"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a4c89d"/><stop offset="1" stop-color="#3e7058"/></linearGradient>
  <linearGradient id="tomato" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb194"/><stop offset="1" stop-color="#c95355"/></linearGradient>
  <linearGradient id="sauce" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#efa77c"/><stop offset="1" stop-color="#8f3541"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#553445" flood-opacity=".17"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="4" result="noise"/><feColorMatrix in="noise" type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .05"/></feComponentTransfer></filter>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="#8b647c" opacity=".12"/></pattern>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#dots)"/>

<ellipse cx="290" cy="170" rx="280" ry="150" fill="#f1cbd7" opacity=".5" filter="url(#soft)"/><ellipse cx="1320" cy="800" rx="280" ry="180" fill="#d6e1ef" opacity=".7" filter="url(#soft)"/>
<g filter="url(#shadow)"><rect x="85" y="72" width="1430" height="856" rx="58" fill="#fffaf8" stroke="#fff" stroke-width="5"/></g>
<text x="145" y="150" font-family="Georgia,serif" font-size="44" fill="#5e4254">AI cooking insights, made visible</text><text x="146" y="192" font-family="Arial,sans-serif" font-size="18" fill="#927488" letter-spacing="2">OBSERVABLE CUES · CONFIDENCE · RISK · CORRECTION</text>
<g transform="translate(135 270)" filter="url(#shadow)"><rect width="650" height="520" rx="46" fill="#302d37"/><ellipse cx="325" cy="405" rx="250" ry="58" fill="#16141a" opacity=".7"/><ellipse cx="330" cy="320" rx="220" ry="100" fill="#191b1e" stroke="#555b61" stroke-width="18"/><ellipse cx="330" cy="304" rx="190" ry="75" fill="#c76751"/><path d="M163 300c65-66 134-89 202-30 45-47 98-42 143 13-58 88-247 113-345 17Z" fill="#8f3f38"/><path d="M187 290c40-38 88-56 135-28M344 270c42-25 87-18 123 17" fill="none" stroke="#e5aa72" stroke-width="10" stroke-linecap="round"/><g fill="#72a26d"><ellipse cx="232" cy="236" rx="38" ry="17" transform="rotate(-26 232 236)"/><ellipse cx="436" cy="238" rx="37" ry="16" transform="rotate(24 436 238)"/></g><path d="M270 225c-18-62 15-98 48-119M352 218c10-65 42-92 82-104" fill="none" stroke="#fff" stroke-width="13" opacity=".38" stroke-linecap="round"/></g>
<g transform="translate(850 255)"><rect width="530" height="565" rx="42" fill="#f4e9ef" stroke="#e8d3df" stroke-width="3"/><text x="34" y="52" font-family="Georgia,serif" font-size="29" fill="#5d4054">Live analysis</text>
<g transform="translate(34 90)"><text y="18" font-family="Arial,sans-serif" font-size="13" fill="#8e7183">BROWNING PROGRESS</text><rect y="36" width="450" height="16" rx="8" fill="#dfd2d9"/><rect y="36" width="340" height="16" rx="8" fill="#b66d72"/><text x="398" y="20" font-family="Georgia,serif" font-size="22" fill="#764e62">76%</text></g>
<g transform="translate(34 170)"><text y="18" font-family="Arial,sans-serif" font-size="13" fill="#657364">MOISTURE RETENTION</text><rect y="36" width="450" height="16" rx="8" fill="#d8e1d7"/><rect y="36" width="382" height="16" rx="8" fill="#72917a"/><text x="398" y="20" font-family="Georgia,serif" font-size="22" fill="#536b5a">85%</text></g>
<g transform="translate(34 250)"><text y="18" font-family="Arial,sans-serif" font-size="13" fill="#8e6a4f">HEAT RISK</text><rect y="36" width="450" height="16" rx="8" fill="#eadbcf"/><rect y="36" width="126" height="16" rx="8" fill="#d79b68"/><text x="398" y="20" font-family="Georgia,serif" font-size="22" fill="#825c42">28%</text></g>
<g transform="translate(34 335)"><rect width="462" height="170" rx="26" fill="#fff"/><text x="24" y="38" font-family="Arial,sans-serif" font-size="13" fill="#8e7183" letter-spacing="1.5">NEXT OBSERVABLE CUE</text><text x="24" y="78" font-family="Georgia,serif" font-size="23" fill="#5d4054">Edges turn lacquered and the sauce</text><text x="24" y="108" font-family="Georgia,serif" font-size="23" fill="#5d4054">coats the spoon without running.</text><text x="24" y="145" font-family="Arial,sans-serif" font-size="15" fill="#6e7e6d">Then lower heat and rest for three minutes.</text></g></g>

<rect width="1600" height="1000" filter="url(#grain)" opacity=".7"/>
</svg>