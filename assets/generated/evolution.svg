<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Mangrok recipe evolution tree</title><desc id="desc">Original Mangrok culinary illustration</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8f4"/><stop offset="0.48" stop-color="#f7eaf1"/><stop offset="1" stop-color="#e7e9f8"/></linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#f5e9e4"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf0f2"/><stop offset="0.45" stop-color="#8e969d"/><stop offset="0.65" stop-color="#f6f7f7"/><stop offset="1" stop-color="#59626a"/></linearGradient>
  <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd0a8"/><stop offset="0.5" stop-color="#c6754a"/><stop offset="1" stop-color="#7b3e2b"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a4c89d"/><stop offset="1" stop-color="#3e7058"/></linearGradient>
  <linearGradient id="tomato" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb194"/><stop offset="1" stop-color="#c95355"/></linearGradient>
  <linearGradient id="sauce" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#efa77c"/><stop offset="1" stop-color="#8f3541"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#553445" flood-opacity=".17"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="4" result="noise"/><feColorMatrix in="noise" type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .05"/></feComponentTransfer></filter>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="#8b647c" opacity=".12"/></pattern>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#dots)"/>

<ellipse cx="245" cy="170" rx="240" ry="140" fill="#f3cbd9" opacity=".58" filter="url(#soft)"/><ellipse cx="1360" cy="820" rx="270" ry="160" fill="#d9e2f0" opacity=".7" filter="url(#soft)"/>
<g filter="url(#shadow)"><rect x="88" y="76" width="1424" height="846" rx="58" fill="#fffaf8" stroke="#fff" stroke-width="5"/></g>
<text x="148" y="154" font-family="Georgia,serif" font-size="44" fill="#5e4254">A recipe becomes a living family tree</text><text x="150" y="196" font-family="Arial,sans-serif" font-size="18" fill="#927488" letter-spacing="2">ORIGINAL FORMULA · LIGHTER · FASTER · SPICIER · GOURMET</text>
<path d="M800 355v120M800 475H280v100M800 475h520v100M800 475H540v100M800 475h260v100" fill="none" stroke="#c7a9ba" stroke-width="8" stroke-linecap="round"/>
<g transform="translate(615 245)" filter="url(#shadow)"><rect width="370" height="160" rx="34" fill="#f0dce6"/><text x="32" y="42" font-family="Arial,sans-serif" font-size="13" fill="#927488">ORIGINAL FORMULA</text><text x="32" y="79" font-family="Georgia,serif" font-size="29" fill="#5d4054">Roasted tomato alchemy</text><text x="32" y="116" font-family="Arial,sans-serif" font-size="15" fill="#735c6c">Balanced acidity · silky texture · warm spice</text></g>
<g transform="translate(145 575)" filter="url(#shadow)"><rect width="270" height="220" rx="32" fill="#eaf1e7"/><ellipse cx="135" cy="92" rx="82" ry="42" fill="#f7efe4"/><path d="M67 91c48-55 105-58 140-5-28 54-91 67-140 5Z" fill="#79a275"/><circle cx="102" cy="77" r="20" fill="#d88c73"/><text x="28" y="170" font-family="Georgia,serif" font-size="24" fill="#516655">Lighter</text><text x="28" y="198" font-family="Arial,sans-serif" font-size="14" fill="#6d7c6d">More herbs, less fat</text></g>
<g transform="translate(475 575)" filter="url(#shadow)"><rect width="270" height="220" rx="32" fill="#f7e8df"/><ellipse cx="135" cy="92" rx="82" ry="42" fill="#f5e6d4"/><path d="M65 96c40-54 111-63 143-10-30 54-94 66-143 10Z" fill="#cf765b"/><path d="M100 56l70 70" stroke="#e8b46f" stroke-width="9" stroke-linecap="round"/><text x="28" y="170" font-family="Georgia,serif" font-size="24" fill="#765342">Faster</text><text x="28" y="198" font-family="Arial,sans-serif" font-size="14" fill="#866b5c">High heat, shorter path</text></g>
<g transform="translate(855 575)" filter="url(#shadow)"><rect width="270" height="220" rx="32" fill="#f4e2e5"/><ellipse cx="135" cy="92" rx="82" ry="42" fill="#f7e9df"/><path d="M69 99c37-61 104-70 139-13-27 59-91 72-139 13Z" fill="#a8434c"/><path d="M120 49c38 26 55 58 47 95" fill="none" stroke="#c34c4b" stroke-width="12"/><text x="28" y="170" font-family="Georgia,serif" font-size="24" fill="#70434e">Spicier</text><text x="28" y="198" font-family="Arial,sans-serif" font-size="14" fill="#86616c">Chili bloom, deeper finish</text></g>
<g transform="translate(1185 575)" filter="url(#shadow)"><rect width="270" height="220" rx="32" fill="#e8e8f3"/><ellipse cx="135" cy="92" rx="82" ry="42" fill="#f7ede5"/><path d="M65 96c45-58 109-59 143-8-29 54-92 68-143 8Z" fill="#7d5773"/><g fill="#d3ae63"><circle cx="105" cy="77" r="8"/><circle cx="150" cy="63" r="8"/><circle cx="180" cy="98" r="8"/></g><text x="28" y="170" font-family="Georgia,serif" font-size="24" fill="#554e73">Gourmet</text><text x="28" y="198" font-family="Arial,sans-serif" font-size="14" fill="#6c6783">Layered aroma, plated finish</text></g>

<rect width="1600" height="1000" filter="url(#grain)" opacity=".7"/>
</svg>