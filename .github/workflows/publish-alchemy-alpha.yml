name: Publish verified Mangrok Alchemy Alpha
on:
  push:
    branches: [agent/alchemy-alpha]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: publish-alchemy-alpha
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Alchemy branch
        uses: actions/checkout@v6
        with:
          ref: agent/alchemy-alpha
          fetch-depth: 0
          persist-credentials: true
      - name: Require materialized, clean source
        shell: bash
        run: |
          test -f src/alchemy-ui.js
          test -f src/culinary-engine.js
          test -f src/local-ai.js
          test -f src/generated/ingredients.js
          test -f src/generated/equipment.js
          test -f supabase/migrations/002_alchemy.sql
          test -f supabase/functions/alchemy-ai/index.ts
          if grep -RIl '^/Td6WFo' . --exclude-dir=.git | grep -q .; then
            echo 'Transport payload remains; refusing publication.'
            exit 1
          fi
          if grep -q 'item\.icon' src/kitchen-ui.js; then
            echo 'Legacy icon-based kitchen cards remain; refusing publication.'
            exit 1
          fi
      - name: Run complete repository checks
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm run check
      - name: Remove one-time publishing automation
        shell: bash
        run: |
          rm -f .github/workflows/publish-alchemy-alpha.yml
          rm -f .github/workflows/materialize-alchemy-alpha.yml
          rm -f .github/workflows/alchemy-verify.yml
          rm -f ALCHEMY_TRANSPORT_STATUS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'finalize Mangrok Alchemy Alpha release'
            git push origin HEAD:agent/alchemy-alpha
          fi
      - name: Merge validated Alpha into main
        shell: bash
        run: |
          git fetch origin main agent/alchemy-alpha
          git checkout -B main origin/main
          git merge --no-ff origin/agent/alchemy-alpha -m 'Launch Mangrok Alchemy Alpha'
          git push origin main
      - name: Dispatch GitHub Pages release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
