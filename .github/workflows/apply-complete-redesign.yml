name: Apply complete Mangrok redesign

on:
  push:
    branches:
      - agent/complete-redesign-live

permissions:
  contents: write

concurrency:
  group: complete-mangrok-redesign
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged release
        uses: actions/checkout@v6
        with:
          ref: agent/complete-redesign-live
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct verified redesign package
        shell: bash
        run: |
          set -euo pipefail
          cat .release/part-*.bin > /tmp/mangrok-redesign.zip
          echo "4dfdb3126ba585e4641f74b4abe9aacb9a051aa03a9bf45cf2f43b7eaf772698  /tmp/mangrok-redesign.zip" | sha256sum --check -
          unzip -t /tmp/mangrok-redesign.zip
          unzip -o /tmp/mangrok-redesign.zip -d .

      - name: Remove obsolete transport and one-time automation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release .materialize .alchemy-source .alchemy-transfer
          rm -f ALCHEMY_TRANSPORT_STATUS.md
          rm -f .github/workflows/alchemy-verify.yml
          rm -f .github/workflows/materialize-alchemy-alpha.yml
          rm -f .github/workflows/materialize-alchemy.yml
          rm -f .github/workflows/publish-alchemy-alpha.yml
          rm -f .github/workflows/apply-complete-redesign.yml

      - name: Verify complete design source
        shell: bash
        run: |
          set -euo pipefail
          required=(
            assets/css/alchemy.css
            assets/generated/hero.svg
            assets/generated/ingredients.svg
            assets/generated/equipment.svg
            assets/generated/insights.svg
            assets/generated/evolution.svg
            src/alchemy-ui.js
            src/culinary-engine.js
            src/local-ai.js
            src/print-decor.js
            supabase/migrations/001_platform.sql
            supabase/migrations/002_alchemy.sql
            supabase/functions/alchemy-ai/index.ts
            tests/alchemy.test.mjs
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required release file: $file"; exit 1; }
          done
          if grep -R "item\\.icon" src index.html assets/css; then
            echo "Legacy icon-based kitchen renderer remains."
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths = [Path('index.html'), *Path('src').glob('*.js'), *Path('assets/css').glob('*.css')]
          emoji = re.compile('[\\U0001F000-\\U0001FAFF]')
          matches = []
          for path in paths:
              text = path.read_text(encoding='utf-8')
              for line_no, line in enumerate(text.splitlines(), 1):
                  if emoji.search(line):
                      matches.append(f'{path}:{line_no}')
          if matches:
              raise SystemExit('Emoji/icon glyphs remain in user-facing source: ' + ', '.join(matches[:20]))
          if 'Alchemy Lab' not in Path('src/alchemy-ui.js').read_text(encoding='utf-8'):
              raise SystemExit('Alchemy workspace is missing.')
          PY

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run complete release gate
        run: npm run check

      - name: Commit reviewable redesign source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No redesign changes were materialized.'
            exit 1
          fi
          git commit -m 'Materialize complete Mangrok Alchemy redesign'
          git push origin HEAD:agent/complete-redesign-live
