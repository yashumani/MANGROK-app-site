name: Export USDA ingredient reference

on:
  push:
    branches:
      - agent/global-ingredient-agent-memory

permissions:
  contents: read

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download and normalize USDA public-domain food names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/usda-ref /tmp/out
          curl --fail --location --retry 3 -o /tmp/usda-ref/foundation.zip https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_foundation_food_json_2026-04-30.zip
          curl --fail --location --retry 3 -o /tmp/usda-ref/sr.zip https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_sr_legacy_food_json_2018-04.zip
          unzip -q /tmp/usda-ref/foundation.zip -d /tmp/usda-ref/foundation
          unzip -q /tmp/usda-ref/sr.zip -d /tmp/usda-ref/sr
          python3 - <<'PY'
          import json, pathlib, re
          out=[]
          for group, root in [('foundation', pathlib.Path('/tmp/usda-ref/foundation')), ('sr_legacy', pathlib.Path('/tmp/usda-ref/sr'))]:
              for path in root.rglob('*.json'):
                  data=json.loads(path.read_text(encoding='utf-8-sig'))
                  rows=[]
                  if isinstance(data,list): rows=data
                  elif isinstance(data,dict):
                      for key in ('FoundationFoods','SRLegacyFoods','foods'):
                          if isinstance(data.get(key),list): rows=data[key]; break
                  for row in rows:
                      name=str(row.get('description') or row.get('lowercaseDescription') or '').strip()
                      if not name: continue
                      out.append({'name':name,'source':group,'fdcId':row.get('fdcId'),'category':(row.get('foodCategory') or {}).get('description') if isinstance(row.get('foodCategory'),dict) else row.get('foodCategory')})
          seen=set(); clean=[]
          for row in out:
              key=re.sub(r'[^a-z0-9]+',' ',row['name'].lower()).strip()
              if not key or key in seen: continue
              seen.add(key); clean.append(row)
          pathlib.Path('/tmp/out/usda-food-names.json').write_text(json.dumps(clean,ensure_ascii=False,indent=2),encoding='utf-8')
          pathlib.Path('/tmp/out/README.txt').write_text('Source: USDA FoodData Central Foundation Foods April 2026 and SR Legacy April 2018. USDA states FoodData Central data are CC0/public domain; attribution requested.\n',encoding='utf-8')
          print(len(clean))
          PY
      - name: Upload reference
        uses: actions/upload-artifact@v4
        with:
          name: usda-ingredient-reference
          path: /tmp/out
          retention-days: 1
