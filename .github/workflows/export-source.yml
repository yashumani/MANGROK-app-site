name: Export Mangrok source

on:
  push:
    branches: ["agent/production-readiness-cycle"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Upload review source
        uses: actions/upload-artifact@v5
        with:
          name: mangrok-production-readiness-source
          path: |
            .
            !.git/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
