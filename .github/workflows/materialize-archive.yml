name: Materialize Mangrok archive redesign

on:
  push:
    branches:
      - agent/archive-design-system

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v6

      - name: Reconstruct verified design source
        run: python3 scripts/materialize_archive.py

      - name: Validate application
        run: npm run check

      - name: Commit verified redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "introduce Mangrok archive design system"
          git push origin "HEAD:${GITHUB_REF_NAME}"
