name: Materialize Mangrok production readiness

on:
  push:
    branches: ["agent/production-readiness-cycle"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-production-readiness
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: agent/production-readiness-cycle
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Reconstruct verified production-readiness source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .release/part00 \
            .release/seg01 \
            .release/seg02 \
            .release/seg03 \
            .release/seg04 \
            .release/seg05 \
            .release/seg06 \
            .release/seg07 \
            | base64 --decode > /tmp/mangrok-production-readiness.tar.xz
          echo "d2cd3d86225fdc835cae77cbf0be2b981ae967c8db5b60076f6c6c3fe5fb5bc8  /tmp/mangrok-production-readiness.tar.xz" | sha256sum --check -
          tar -xJf /tmp/mangrok-production-readiness.tar.xz
          rm -rf .release
          rm -f .github/workflows/export-source.yml
          rm -f .github/workflows/materialize-production-readiness.yml

      - name: Validate complete application
        run: npm run check

      - name: Commit reviewable production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No production-readiness changes found."
            exit 1
          fi
          git commit -m "Complete Mangrok production-readiness cycle"
          git push origin HEAD:agent/production-readiness-cycle
