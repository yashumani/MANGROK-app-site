name: Materialize complete Mangrok platform

on:
  push:
    branches:
      - agent/end-to-end-platform

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out platform branch
        uses: actions/checkout@v6

      - name: Reconstruct and verify source
        run: python3 scripts/materialize_v2.py

      - name: Commit verified platform
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "materialize complete Mangrok platform"
          git push origin "HEAD:${GITHUB_REF_NAME}"
