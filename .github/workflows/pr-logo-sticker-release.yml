name: Materialize and verify Mangrok brand release

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: mangrok-logo-sticker-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.head.ref == 'release/logo-sticker-studio-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Configure Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Load trusted release materializer from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:.github/scripts/release-logo-sticker-studio-v2.sh > /tmp/release-logo-sticker-studio.sh
          chmod +x /tmp/release-logo-sticker-studio.sh
      - name: Materialize, integrate, and verify
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: /tmp/release-logo-sticker-studio.sh
