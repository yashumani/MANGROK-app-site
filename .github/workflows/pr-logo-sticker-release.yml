name: Verify, merge, and deploy Mangrok brand release

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: mangrok-logo-sticker-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.head.ref == 'release/logo-sticker-studio-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Configure Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Materialize, integrate, and verify
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash .github/scripts/release-logo-sticker-studio.sh
      - name: Merge the verified pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          sleep 5
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
      - name: Upload exact verified Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy exact verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
