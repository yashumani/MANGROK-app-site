name: Materialize and verify Mangrok brand release

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: mangrok-logo-sticker-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.head.ref == 'release/logo-sticker-studio-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Configure Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Materialize, integrate, and verify
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash .github/scripts/release-logo-sticker-studio.sh
