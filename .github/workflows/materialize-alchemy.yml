name: Materialize Mangrok Alchemy Alpha
on:
  push:
    branches: ["agent/alchemy-alpha"]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Alchemy branch
        uses: actions/checkout@v6
        with:
          ref: agent/alchemy-alpha
          fetch-depth: 0
      - name: Reconstruct verified Alchemy source
        shell: bash
        run: |
          set -euo pipefail
          cat .materialize/alchemy.part* | base64 --decode > alchemy.tar.xz
          echo "5956ffaed608159952b22a1a14e9d43d52bc7da492446ab02c4b63180fb92899  alchemy.tar.xz" | sha256sum --check -
          tar -xJf alchemy.tar.xz
          rm -rf alchemy.tar.xz .materialize .github/workflows/materialize-alchemy.yml
      - name: Validate application
        run: npm run check
      - name: Commit verified Alchemy Alpha
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized changes."
            exit 0
          fi
          git commit -m "introduce Mangrok Alchemy Alpha"
          git push origin HEAD:agent/alchemy-alpha
