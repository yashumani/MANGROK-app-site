name: Materialize Mangrok Alchemy Alpha
on:
  push:
    branches: ["agent/alchemy-alpha"]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Alchemy branch
        uses: actions/checkout@v6
        with:
          ref: agent/alchemy-alpha
          fetch-depth: 0
      - name: Reconstruct and inspect Alchemy source
        shell: bash
        run: |
          set -euo pipefail
          cat .materialize/alchemy.part* | base64 --decode > alchemy.tar.xz
          echo "Reconstructed archive: $(sha256sum alchemy.tar.xz)"
          xz --test alchemy.tar.xz
          tar -tJf alchemy.tar.xz | sort > /tmp/alchemy-files.actual
          cat > /tmp/alchemy-files.expected <<'EOF'
          assets/css/alchemy.css
          docs/ALCHEMY-ALPHA.md
          docs/LOCAL-AI.md
          index.html
          local-ai/README.md
          local-ai/ollama/Modelfile
          package.json
          runtime-config.js
          scripts/build.mjs
          scripts/validate.mjs
          src/alchemy-ui.js
          src/app.js
          src/cloud.js
          src/culinary-engine.js
          src/generated-images.js
          src/generated/equipment.js
          src/generated/evolution.js
          src/generated/hero.js
          src/generated/ingredients.js
          src/generated/insights.js
          src/kitchen-ui.js
          src/local-ai.js
          src/print-decor.js
          src/print.js
          styles.css
          supabase/functions/alchemy-ai/.env.example
          supabase/functions/alchemy-ai/index.ts
          supabase/migrations/002_alchemy.sql
          sw.js
          tests/alchemy.test.mjs
          EOF
          sed -i 's/^          //' /tmp/alchemy-files.expected
          diff -u /tmp/alchemy-files.expected /tmp/alchemy-files.actual
          tar -xJf alchemy.tar.xz
          rm -rf alchemy.tar.xz .materialize .github/workflows/materialize-alchemy.yml
      - name: Validate application
        run: npm run check
      - name: Commit verified Alchemy Alpha
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized changes."
            exit 0
          fi
          git commit -m "introduce Mangrok Alchemy Alpha"
          git push origin HEAD:agent/alchemy-alpha
